services:
  - type: web
    name: plant-identifier-api
    env: node
    rootDir: ./apps/api
    buildCommand: pnpm install --frozen-lockfile && pnpm build:render
    startCommand: pnpm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: plant-identifier-api
          property: port
    # Add your environment variables here
    # - key: OPENAI_API_KEY
    #   sync: false  # This will be manually set in Render dashboard
    # - key: GOOGLE_API_KEY
    #   sync: false